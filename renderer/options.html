<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
<title>Options</title>
<link rel="stylesheet" href="ui.css"></head>
<body class="set">
  <h1 id="h"></h1>
  <h2 id="gGen"></h2>
  <div class="grp">
    <label class="cell"><span id="lUi"></span><select id="ui"></select></label>
    <label class="cell"><span id="lZoom"></span><select id="zoom"></select></label>
    <label class="cell"><span id="lLook"></span><select id="look"></select></label>
    <div class="cell"><span id="lAcc"></span><div class="sws" id="acc"></div></div>
  </div>
  <h2 id="gAi"></h2>
  <div class="grp">
    <div class="cell"><span><span id="lMode"></span> <button class="help" data-help="Mode" type="button"></button></span><select id="mode"></select></div>
    <div class="cell"><span id="tAi"></span><button id="ai"></button></div>
    <div class="cell"><span id="tTheme"></span><button id="theme"></button></div>
  </div>
  <h2><span id="tMsg"></span><button class="help" data-help="Msg" type="button"></button></h2>
  <div class="grp">
    <div class="cell"><span id="lOn"></span><label class="sw"><input type="checkbox" id="mon"><span></span></label></div>
    <label class="cell"><span id="lId"></span><input type="text" id="uid" maxlength="12" inputmode="numeric"></label>
    <label class="cell"><span id="lTo"></span><select id="to"></select></label>
    <label class="cell"><span id="lTone"></span><select id="tone"></select></label>
    <label class="cell" id="sayRow"><span id="lSay"></span><input type="text" id="say" maxlength="60"></label>
  </div>
  <p class="foot" id="dMsg"></p>
  <h2 id="tDl"></h2>
  <div class="grp">
    <div class="cell"><span class="val" id="dl"></span><button id="pickDir"></button></div>
    <div class="cell"><span id="lAsk"></span><label class="sw"><input type="checkbox" id="ask"><span></span></label></div>
  </div>
  <h2 id="tPacks"></h2>
  <div class="grp" id="packs"></div>
  <h2 id="gStore"></h2>
  <div class="grp">
    <div class="cell"><span id="lFresh"></span><button id="fresh" type="button"></button></div>
    <div class="cell"><span id="lWipe"></span><button id="wipe" class="danger" type="button"></button></div>
  </div>
  <p class="foot" id="dStore"></p>
  <div id="msg"></div>
  <script src="help.js"></script>
  <script src="options.js"></script>
</body></html>
